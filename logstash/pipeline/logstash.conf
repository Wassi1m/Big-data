input {
  kafka {
    bootstrap_servers => "kafka:29092"
    topics => ["taxi-locations", "client-requests", "zone-stats"]
    group_id => "logstash-uber"
    codec => "json"
    decorate_events => "basic"
    auto_offset_reset => "latest"
  }
}

filter {
  mutate { add_field => { "[@metadata][topic]" => "%{[@metadata][kafka][topic]}" } }

  if [lat] and [lon] {
    mutate { add_field => { "location" => "%{lat},%{lon}" } }
  }
  if [pickup_lat] {
    mutate { add_field => { "pickup_location" => "%{pickup_lat},%{pickup_lon}" } }
    mutate { add_field => { "dropoff_location" => "%{dropoff_lat},%{dropoff_lon}" } }
  }
  date { match => ["timestamp", "ISO8601"] target => "@timestamp" }
}

output {
  if [@metadata][topic] == "taxi-locations" {
    # Historique de toutes les positions
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "taxi-locations-history" }
    # Derniere position de chaque taxi (carte temps reel)
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "taxi-locations-live"
      document_id => "%{taxi_id}"
      action => "index"
    }
  } else if [@metadata][topic] == "client-requests" {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "client-requests-history" }
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "client-requests-live"
      document_id => "%{request_id}"
      action => "index"
    }
  } else if [@metadata][topic] == "zone-stats" {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "zone-stats" }
  }
}
